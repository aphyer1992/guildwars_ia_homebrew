# Physical sizes for tools/render_print.py (designer's measurements, 2026-09-26).
page: {width_in: 8.5, height_in: 11}          # US Letter
card: {width_in: 2.25, height_in: 3.5}        # IA cards, sleeved
token:
  diameter_in: 1.0                            # IA cardboard tokens; grid squares are 1 in
  rim_mm: 2                                   # coloured edge
  gap_in: 0.12                                # spacing between tokens on the sheet
rims: {regular: "#ffffff", elite: "#c0282d", hero: "#2d5fb3"}
card_borders: {regular: "#8a8a8a", elite: "#b3262a"}
# Affiliation sigil for the card's corner tab and faint watermark (any image in art/).
# Designer's picks (2026-09-26); a missing file falls back to the IA symbol.
affiliation_sigils:
  adversary: art/sigils/Crude_Shield_transparent.png  # Crude_Shield.jpg with the white background removed
  beast: art/sigils/ranger.png
  hero: art/sigils/hardmode_helmet.png
