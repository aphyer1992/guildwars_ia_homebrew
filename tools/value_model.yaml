# Value model for tools/attack.py --value.
#
# An attack's value is measured in "damage equivalents". For each situation below,
# the attacker spends surges and rerolls to maximise value in that situation. The
# attack's score is the weighted average across situations.
#
# All numbers here are rough first guesses, meant for the designer to tune. The goal is
# to flag outliers, not to be exact.
#
# How each part of an attack is scored:
#   damage     min(damage, target_hp), plus kill_bonus if it reaches target_hp.
#              Overkill is wasted.
#   cleave     needs a cleave target (cleave_hp) and at least 1 damage on the main
#              target. Scores min(cleave, cleave_hp), plus kill_bonus if it kills.
#   blast      needs at least 1 damage on the target. Each hostile figure in `blast`
#              (listed by health) scores min(blast, hp), plus kill_bonus if it dies.
#              Each friendly figure next to the target scores -blast.
#   recover    min(recover, attacker_missing_hp) * recover_weight. Works even on a miss.
#   strain     hero attackers only: 1 surge -> recover 1 strain (IA rule), worth
#              strain_value while attacker_missing_strain > 0.
#   conditions harmful ones are worth their value only if the target survives.
#              Beneficial ones (focus, hidden) go to the attacker and always count.
#              All condition keywords need at least 1 damage on the target.
#   focus      the listed value times min(1, (attacker health + 2) / 10). A fragile
#              attacker is often defeated before it can use the extra green die.
#              Heroes are assumed to have 12 Health.
#
# Condition values against heroes (designer's reasoning, 2026-09-26):
#   Stun  a hero spends an action to clear it, and Rest recovers Endurance (~4), so
#         it costs up to ~4 damage-equivalents in actions. But the Adversary usually
#         wants to wound: a stunned hero at 8 damage isn't wounded, so for spiking
#         it's worth ~0. Average about 2-2.5.
#   Bleed strong early in a mission (clear it or bleed all game), weak late (just
#         ignore it). About 1.5.
#   Focus +1 green die on the next attack (1.33 damage, 0.5 surges), about 2 if the
#         figure survives to use it.

perspectives:
  # An enemy figure attacking a hero. Hero Health is typically 10-14.
  # Heroes are few and mobile, and the Adversary wants to focus fire, not spread
  # damage. Cleave is usually usable but worth less per point than main-target damage;
  # Blast only sometimes reaches a second hero. Designer's targets: Cleave 1 and
  # Blast 1 are each worth less than +1 damage.
  vs_heroes:
    kill_bonus: 3          # wounding (or withdrawing) a hero is a big swing
    recover_weight: 1.0
    strain_value: 0        # enemies don't use strain
    targets:               # designer's judgements; checked by --calibrate
      - Cleave 1 < +1 damage
      - Blast 1 < +1 damage
    cleave_weight: 0.5     # focus fire: spread damage is worth less
    blast_weight: 0.75
    conditions: {stun: 2.25, bleed: 1.5, weaken: 0.75, focus: 2.0, hidden: 1.0}
    situations:
      - {name: "fresh hero, alone",         weight: 0.20, target_hp: 12}
      - {name: "fresh hero, ally in reach", weight: 0.25, target_hp: 12, cleave_hp: 12, attacker_missing_hp: 2}
      - {name: "heroes bunched up",         weight: 0.15, target_hp: 12, cleave_hp: 12, blast: [12]}
      - {name: "hurt hero",                 weight: 0.15, target_hp: 5, cleave_hp: 10, attacker_missing_hp: 3}
      - {name: "nearly wounded",            weight: 0.10, target_hp: 2, cleave_hp: 8}
      - {name: "melee scrum",               weight: 0.15, target_hp: 8, cleave_hp: 10, blast: [10], attacker_missing_hp: 4}

  # A hero attacking an enemy figure. Used for weapons.
  # Heroes face many enemies, so Cleave is almost always usable (with Reach, nearly
  # anyone) and often beats raw damage by finishing off several figures. Blast is
  # sometimes unusable, but often each point is worth 2+ (a group of 3 deploying
  # together). Designer's targets: Cleave 2 > +2 damage; +1 damage < Blast 1 < +2
  # damage, with Blast 1 much closer to +2.
  vs_enemies:
    kill_bonus: 2          # removing a figure denies an activation
    recover_weight: 1.0
    strain_value: 0.5
    targets:
      - Cleave 2 > +2 damage
      - Blast 1 > +1 damage
      - Blast 1 < +2 damage
    # Above 1: spreading damage over a group of low-health figures sets up kills, so
    # these are tuned until the designer's targets above hold (--calibrate).
    cleave_weight: 1.5
    blast_weight: 1.75
    # Not yet reviewed by the designer; the stun/bleed reasoning above is about heroes.
    conditions: {stun: 1.5, bleed: 1.0, weaken: 0.75, focus: 2.0, hidden: 1.0}
    situations:
      - {name: "fresh group of 3",       weight: 0.25, target_hp: 3, cleave_hp: 3, blast: [3, 3], attacker_missing_strain: 2}
      - {name: "damaged group",          weight: 0.20, target_hp: 3, cleave_hp: 1, blast: [1, 2], attacker_missing_hp: 3, attacker_missing_strain: 1}
      - {name: "mid-size with escort",   weight: 0.20, target_hp: 6, cleave_hp: 2, blast: [3], attacker_missing_strain: 2}
      - {name: "damaged mid-size",       weight: 0.10, target_hp: 3, cleave_hp: 6, attacker_missing_hp: 5}
      - {name: "big figure with escort", weight: 0.15, target_hp: 10, cleave_hp: 3, attacker_missing_hp: 2, attacker_missing_strain: 3}
      - {name: "boss, ally adjacent",    weight: 0.10, target_hp: 16, cleave_hp: 4, blast: [4], blast_friendly: 1, attacker_missing_hp: 6, attacker_missing_strain: 4}
