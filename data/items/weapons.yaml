# Weapon families noted in the original doc without details:
#   melee:   "Tormented [things]"
#   ranged:  Ascalon -, Bramble -, Jade -, Skull -, Spiked -, Feathered - (bows)
#   magical: Destroyer -, Tormented -, Celestial -
families:
  melee: [Tormented]
  ranged: [Ascalon, Bramble, Jade, Skull, Spiked, Feathered]
  magical: [Destroyer, Tormented, Celestial]
