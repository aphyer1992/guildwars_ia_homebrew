name: Old Mac
health: 12
endurance: 4
speed: 4
defense: [black]
attributes:  # a Warrior in the MMO: sturdier than he is agile
  strength: [blue, green, green]
  agility: [blue, blue, green]
  arcana: [blue]

abilities:
  - name: Charm Animal
    text: >-
      At the start of the mission (after fixed groups but before selecting open
      groups), Old Mac selects a non-unique Beast deployment with a figure cost
      <= the threat level. One such figure (even if the group size is larger)
      deploys as an ally, without granting the Adversary player more <threat>.
      This is Joe. Joe activates at the start or end of Old Mac's activation.
  - name: Comfort Animal
    text: >-
      2<strain>, <action>: if Joe has been defeated, replace him in a square next
      to Old Mac.

class_cards:
  - name: Flail  # slight encouragement towards melee old mac.  I'd like him to be able to go melee or ranged as you prefer, which means minor pushes towards melee (since heroes with no such thing go ranged) but not hard melee-only abilities.
    xp: 1 
    text: >-
      Exhaust this card when Old Mac or Joe declares an attack.  Apply +1 damage to the attack.  The Adversary player may select any of their figures that is a valid target as the target of this attack.
  - name: I Will Avenge You!
    xp: null  # TODO: no XP cost given
    text: >-
      If Joe is not on the map, exhaust this card during your activation to recover 2
      Health or become Focused. 
      
      If Old Mac is Wounded, exhaust this card during
      your activation. Joe interrupts to perform an action.
  - name: Heal as One
    xp: null  # TODO: no XP cost given
    text: >-
      Whenever Old Mac performs a rest, Joe recovers 2HP.
  - name: Strike as One
    xp: 4
    text: >-
      After Joe performs an attack, pay 2<strain> and exhaust this card. Old Mac
      may immediately interrupt to perform an attack against the same target.
      During this attack, remove 1 defense die from the target's pool.
  - name: Predatory Bond
    xp: null
    status: stub
    text: null
