name: General Morgahn
health: 13
endurance: 4
speed: 4
defense: [black]
attributes:  # Paragon/Ranger spear-thrower: good strength, okay agility, bad arcana
  strength: [blue, green, yellow]
  agility: [blue, green]
  arcana: [blue]

abilities:
  - name: Command
    text: >-
      2<strain> - a friendly figure within 3 spaces may interrupt to perform a
      move or attack. If the figure is an ally with figure cost <= the threat
      level, this ability costs 1 less <strain>.
  - name: Leadership
    healthy_only: true
    text: >-
      Allies attacking while Commanded may use your surge abilities.  This cannot grant Cleave to a ranged attack or Blast to a melee attack.

class_cards:
  - name: Signet of Synergy  # Mending Refrain?
    xp: 2 # maybe 3?  maybe strain cost on the second option?
    text: >-
      When you Command, choose one:
      - you and the Commanded ally each restore 1HP.
      - choose a negative condition, and remove that condition from both you and the Commanded ally.
  - name: Make Haste!
    xp: 3 # maybe 
    text: >-
      Exhaust this card during your activation.  You and any number of allies within 3 spaces each gain 1 Movement Point.
  - name: Focused Anger
    xp: 3
    text: >-
      When you or a commanded ally is attacking, the attack gains <surge>: Focus.
  - name: Never Surrender!  # this is currently maybe pushing it when the imperial player is trying to kill the last unwounded hero.
    xp: 3
    status: stub
    text: Exhaust this card during your activation.  You or an ally within 3 spaces may recover 1<strain>, plus 1<health> for each wounded hero.
  - name: Anthem of Flame # Could adjust the strain cost here to raise or lower its cost: 2strain and 1 XP or no strain and 3XP both seem plausible?
    xp: 2
    text: >-
      1<strain>: Exhaust this card when you or a Commanded ally declares an attack to add a yellow die to the attack pool.  The attack gains <surge>: gain <power-surge>.
  - name: Enduring Harmony  # most chars don't get 5 endurance but +1 endurance on a skill is acceptable, and Paragon/Warrior are good fits for it.