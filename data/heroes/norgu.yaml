name: Norgu
health: 12  # default hero health; designer may cut to 10-11 later
endurance: 4  # default hero endurance
speed: 4  # default: designer says assume 4
defense: [white]  # mesmer: spellcaster
attributes:  # Mesmer: good arcana, mediocre agility, bad strength
  strength: [blue]
  agility: [blue, green]
  arcana: [blue, green, yellow]

abilities:
  - name: Power Block
    text: >-
      When you deal attack damage with a Magical weapon, you may pay 1<strain>,
      +1<strain> if the target's figure cost is greater than the threat level, and
      +1<strain> more if it is greater than twice the threat level. If you do, the
      target figure's text box is blank until the end of the round. (This does not
      affect abilities unless they are written in the text box, e.g. most <surge>
      abilities will be unaffected.)
  - name: Illusionary Weaponry
    healthy_only: true
    text: >-
      While attacking, you gain <surge>: -1<damage>, Pierce 3.

class_cards:
  - name: Imagined Burden
    xp: 1
    text: >-
      Whenever an enemy figure is moving, it treats clear spaces adjacent to
      you as difficult terrain.
  - name: Phantom Pain
    xp: 1
    text: >-
      Exhaust this card during your activation to roll an Arcana check. For
      each success, you may move 1 damage token from one enemy figure within 3
      spaces to another enemy figure within 3 spaces.
  - name: Cry of Frustration
    xp: 2
    text: >-
      When you apply Power Block to a figure in a group, exhaust this card to
      affect the entire group.
  - name: Energy Tap
    xp: 2
    text: >-
      When an enemy under the effects of Power Block is killed, exhaust this
      card to recover 2<strain> or become Focused.
  - name: Stolen Speed
    xp: 3
    text: >-
      Exhaust this card when an enemy within 3 spaces declares a move action to
      roll an Arcana check. For each success, that enemy gains 1 less move
      point and you gain 1 move point.
  - name: Arcane Thievery
    xp: 3
    text: >-
      When you apply Power Block, you may gain one ability from the targeted
      figure's textbox until the end of the round.
  - name: Conjure Phantasm
    xp: 4
    status: stub
    text: Whenever an attack is declared targeting a figure under Power Block, remove 1 defense die from its defense pool.
  - name: Arcane Mimicry
    xp: 4
    text: >-
      Choose up to 4 XP of unpurchased skill cards from allied heroes. You gain
      those skills.
