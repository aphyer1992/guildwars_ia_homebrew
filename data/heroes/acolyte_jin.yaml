name: Acolyte Jin
health: 12
endurance: 4
speed: 4  # default: designer says assume 4
defense: [black]
attributes:
  strength: [blue]
  agility: [blue, green, yellow]
  arcana: [blue, green]

abilities:
  - name: Apply Poison
    text: >-
      2<strain>: for the rest of the activation, your attacks with Ranged
      weapons gain Pierce 1 and Weaken.
  - name: Deadly Focus
    healthy_only: true
    text: >-
      At the end of your activation, if you used both actions on the same
      thing (e.g. two attacks, or two rests), you become Focused.

class_cards:
  - name: Focused Shot
    xp: 1
    text: >-
      When you declare an attack with a Ranged weapon while Focused, you may
      exhaust this card to regain 1<strain>, and you may choose to add any color
      of die instead of just a green one.
  - name: Mending Touch  # if you've been looking at the wiki you will recognize this as a monk skill.  This is true, but for mechanical reasons (melee range, works with Expertise) it's actually taken very often on Rangers with second-profession Monk and very rarely on primary Monks
    xp: 1
    text: >-
      Pay 1<strain> and exhaust this card during your turn. You or an adjacent
      ally may either heal 2 Health or discard a negative condition.
  - name: Read the Wind
    xp: 2
    text: >-
      When you or an ally within 3 spaces declares a ranged attack, apply +1
      Accuracy to the attack results. When an enemy declares a ranged attack
      against you or an ally within 3 spaces, apply -1 Accuracy to
      the attack results.
  - name: Penetrating Attack
    xp: 2
    text: >-
      Exhaust this card while attacking with a Martial weapon to convert all Pierce on this attack to an equal amount of +damage.
  - name: Splinter Shot  # undecided on whether to give this char AOE at all, but if we were to this is the obvious skill
    xp: 2
    text: >-
      Exhaust this card while attacking with a Ranged weapon.  For every point of damage blocked by armor, apply an equal amount of Blast to the attack.
  - name: Zojin's Haste
    xp: 3
    text: >-
      After an attack is resolved by you or against you, you may move 1 space.
  - name: Toxicity
    xp: 4
    text: >-
      Whenever you or an ally declares an attack against an enemy subject to Weaken, apply -1<block> to the
      defense results.
  - name: Barrage
    xp: 4
    text: >-
      Action, Action: perform three attacks with a Ranged weapon. Each attack
      must target a different enemy.
