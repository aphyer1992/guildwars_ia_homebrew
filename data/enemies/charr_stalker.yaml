name: Charr Stalker
affiliation: adversary
group_size: 2
traits: [Charr]
speed: 4
defense: [black]
attack:
  type: ranged
  dice: [blue, yellow]  # elite adds a blue die (see variants.elite.dice)

variants:
  regular:
    cost: 6
    reinforce: 3
    health: 5
    surges: ["Blast 1", "+1 damage", "+2 Accuracy"]  # matches elite Rebel Troopers (same dice and Aim)
    abilities:
      # Original: "Move (Rampage) as One" - parentheses read as the elite version.
      - name: Move as One
        text: >-
          Action: a Beast ally within 3 spaces may interrupt to perform a move.
          Limit once per group per activation.
  elite:
    name: Charr Hunter  # the MMO's tougher Charr ranger (level 8 vs the Stalker's 5-6)
    cost: 10
    reinforce: 5
    health: 7
    dice: [blue, blue, yellow]  # with Aim, never misses at range 6
    surges: ["Blast 1", "+1 damage", "+2 Accuracy"]  # same as the Stalker; the extra blue die is the upgrade
    abilities:
      - name: Rampage as One
        text: >-
          Action: a Beast ally within 3 spaces may interrupt to perform an
          attack. Limit once per group per activation.

abilities:
  - name: Aim
    text: >-
      If you have not exited your space this activation, apply +1<damage> and +2
      accuracy to your attacks.
