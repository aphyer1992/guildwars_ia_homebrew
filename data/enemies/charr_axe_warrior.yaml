name: Charr Axe Warrior
affiliation: adversary
group_size: 2
traits: [Charr]
speed: 4
defense: [black]
attack:
  type: melee
  dice: [red, yellow]  # elite adds a yellow die (see variants.elite.dice)

variants:
  regular:
    cost: 6
    reinforce: 3
    health: 6
    surges: ["Bleed", "+1 damage"]
  elite:
    name: Charr Axe Fiend  # original: "Charr Axe Warrior (Fiend)"
    cost: 10
    reinforce: 5
    health: 8
    dice: [red, yellow, yellow]
    surges: ["+1 damage, Bleed"]

abilities:
  - name: Executioner's Strike
    text: >-
      When you declare an attack, if the target is suffering from Bleed, the
      attack gains <surge>: +2<damage>.
